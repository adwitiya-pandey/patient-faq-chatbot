[project]
name = "faq-bot"
version = "0.1.0"
description = "Hospital patient FAQ chatbot: raw SDK, deterministic safety layers, Streamlit UI, mocked-LLM tests"
readme = "README.md"
authors = [
    { name = "adwitiya-pandey", email = "76179646+adwitiya-pandey@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai==2.31.0",
    "pydantic>=2.12,<3",
    "python-dotenv==1.2.4",
    "streamlit==1.66.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]
